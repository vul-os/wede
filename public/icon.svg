<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="wede">
  <title>wede</title>
  <!-- Transparent variant of brand/logo.svg's mark (same stripes/slash, no
       background tile) for the app's dark theme: stripes in the mark's light
       colour so they read against the near-black c_bg_primary token
       (#11131a). Previously this file carried an older 5-stripe design in a
       near-black fill that was ~1.1:1 contrast against that background,
       effectively invisible. -->
  <g fill="#EDEDF6">
    <rect x="26" y="24" width="76" height="13" rx="6.5"/>
    <rect x="26" y="47" width="76" height="13" rx="6.5"/>
    <rect x="26" y="70" width="76" height="13" rx="6.5"/>
    <rect x="26" y="93" width="76" height="13" rx="6.5"/>
  </g>
  <line x1="50" y1="16" x2="82" y2="114" stroke="#FF5E57" stroke-width="13" stroke-linecap="round"/>
  <g fill="#EDEDF6">
    <rect x="26" y="47" width="76" height="13" rx="6.5"/>
    <rect x="26" y="93" width="76" height="13" rx="6.5"/>
  </g>
</svg>

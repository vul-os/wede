name: Release

# Triggered by pushing a semver tag, e.g. v0.3.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub Releases + upload assets

jobs:
  # ── Build cross-compiled binaries ─────────────────────────────────────────────
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ── Verify tag matches package.json version ────────────────────────────────
      # Run this once (only on the first matrix shard is fine — all shards share
      # the same tag, so any failure would repeat identically; still, matrix jobs
      # run in parallel so we let every shard check and fail fast.)
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            echo "Bump version in package.json to ${TAG_VERSION} before tagging."
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION == $TAG_VERSION"

      - run: npm ci

      - name: JS lint
        run: npm run lint

      - run: npm run build

      # ── Go: test + vet ────────────────────────────────────────────────────────
      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      # ── Cross-compile ─────────────────────────────────────────────────────────
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p backend/cmd/wede/dist
          cp -r dist/* backend/cmd/wede/dist/
          mkdir -p backend/cmd/wede/site
          cp -r site/* backend/cmd/wede/site/

          VERSION="${GITHUB_REF_NAME}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          go build -tags embed_frontend \
            -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o "wede-${GOOS}-${GOARCH}${EXT}" ./backend/cmd/wede

          rm -rf backend/cmd/wede/dist backend/cmd/wede/site

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wede-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wede-*

  # ── Create GitHub Release with all artifacts ───────────────────────────────────
  publish:
    name: Publish Release (checksummed + attested)
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write       # create the Release and upload assets
      id-token: write       # mint the OIDC token the attestation is signed with
      attestations: write   # record the attestation against this repo
    steps:
      # scripts/verify.sh checks this job's own output below, so the repo has
      # to be present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Everything that will be published lands in artifacts/ and nothing else
      # does. The manifest covers that directory, so "published" and "covered"
      # are the same set by construction rather than two lists someone keeps in
      # sync by hand.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          set -euo pipefail

          # Portable listing (no find -printf): the staging dir is flat by
          # construction, one line per asset, sorted so the manifest is
          # reproducible.
          mapfile -t ASSETS < <(find . -maxdepth 1 -type f ! -name checksums.txt -exec basename {} \; | LC_ALL=C sort)

          # FAIL CLOSED. A build that produced nothing must be a red release,
          # not a green one with an empty manifest. `sha256sum wede-*` used to
          # be the whole step: with no matching files the glob would go through
          # literally, sha256sum would error, and — because this ran without
          # `set -e` under a `cd` — the release could still be created with a
          # checksums.txt that vouched for nothing.
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::artifacts/ contains no files — refusing to publish a release whose manifest would vouch for nothing."
            exit 1
          fi

          : > checksums.txt
          for a in "${ASSETS[@]}"; do
            sha256sum "$a" >> checksums.txt
          done

          # COVERAGE ASSERTION. Without this the step is trivially satisfiable:
          # a manifest with one line "covers" a five-asset release and every
          # later check still passes. Pin line count to asset count.
          # tr: BSD wc pads its output, and the error message would otherwise
          # read "        1 line(s)".
          LINES="$(wc -l < checksums.txt | tr -d ' ')"
          if [ "$LINES" -ne "${#ASSETS[@]}" ]; then
            echo "::error::checksums.txt has ${LINES} line(s) for ${#ASSETS[@]} staged artifact(s) — the manifest does not cover the release."
            exit 1
          fi

          echo "checksums.txt covers ${#ASSETS[@]} artifact(s):"
          cat checksums.txt
          printf '%s\n' "${ASSETS[@]}" > "${RUNNER_TEMP}/release-assets.txt"

      # The producer checked by the consumer. If verify.sh and the emit step
      # ever disagree about the format, this is where it surfaces — in a red
      # release job, not in a user's terminal after the release is public.
      - name: Verify checksums.txt with the same script users run
        run: |
          set -euo pipefail
          mapfile -t ASSETS < "${RUNNER_TEMP}/release-assets.txt"
          bash scripts/verify.sh --dir artifacts "${ASSETS[@]}"

      # Proves the verifier's refusals still fire on this runner, on this
      # release, before anything is published. A verifier whose failure paths
      # are never exercised is a verifier that has probably stopped failing.
      - name: Prove the verifier still refuses broken releases
        run: bash scripts/verify.sh --selftest

      # The same proof for install.sh, which is the script users actually pipe
      # into a shell.
      - name: Prove install.sh still refuses unverified bytes
        run: bash scripts/install-failure-matrix.sh

      # Short-lived sigstore cert minted from this job's OIDC identity. No
      # secret is referenced here and none needs to exist: there is no key to
      # store, own or rotate. Attests every file in artifacts/, including
      # checksums.txt itself — so an attestation on the manifest transitively
      # covers every asset the manifest names.
      - name: Attest build provenance (sigstore via OIDC — no long-lived key)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "artifacts/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### Verify before you run this

            ```sh
            curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/verify.sh
            bash verify.sh --tag ${{ github.ref_name }} --attest wede-linux-amd64
            ```

            `verify.sh` fetches `checksums.txt`, looks up the exact entry for
            the asset and compares digests. It exits non-zero, with a distinct
            diagnostic, on a missing or malformed manifest, a missing entry, a
            truncated download or a digest mismatch. There is no skip path.
            `--attest` additionally checks the sigstore build provenance (needs
            the `gh` CLI); without it, provenance is NOT checked and the script
            says so rather than letting a pass imply more than it checked.

            `install.sh` performs the same digest check itself and will not
            install a binary it could not verify.
          # Publish the directory the manifest covers, not a hand-listed set of
          # names that can drift away from it.
          files: |
            artifacts/*

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: npm ci

      - name: JS lint
        run: npm run lint

      # CI never ran the JS unit tests at all.
      - name: JS unit tests
        run: npm test

      - run: npm run build

      # `npm run build` exiting 0 proves nothing about whether the bundle RUNS.
      # Two apps in this suite shipped a blank screen behind a green build. wede's
      # ~1 MB of CodeMirror/xterm/Yjs had never been loaded in a browser by any
      # test — and the IDE is gated behind ThemePicker + Login, so the heavy code
      # only evaluates on the THIRD surface. Boot all three in real chromium and
      # fail on any uncaught exception or empty root.
      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Boot guard + IDE E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wede-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build Go binary
        run: |
          mkdir -p backend/cmd/wede/dist
          cp -r dist/* backend/cmd/wede/dist/
          cp -r site backend/cmd/wede/site
          go build -tags embed_frontend -o wede ./backend/cmd/wede
          rm -rf backend/cmd/wede/dist backend/cmd/wede/site

      - name: Verify binary
        run: ./wede --version

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

  # A checksum guard that has quietly stopped failing is indistinguishable,
  # from a green CI run, from one that works. So both guards are exercised on
  # every push: not "does the script parse", but "does it still REFUSE".
  release-guards:
    name: Release verifier & installer — failure matrices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n scripts/verify.sh
          bash -n install.sh
          bash -n scripts/install-failure-matrix.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh install.sh scripts/install-failure-matrix.sh

      # 24 synthetic-origin cases; asserts the exit code AND that a diagnostic
      # was printed, because "aborted with no message" was the real bug class.
      - name: verify.sh failure matrix
        run: bash scripts/verify.sh --selftest

      # 14 cases against a synthetic release origin; asserts the exit code, a
      # diagnostic, and — the one that matters — that NOTHING was installed on
      # any case except the one where the published digest matched.
      - name: install.sh failure matrix
        run: bash scripts/install-failure-matrix.sh

  # The landing page and docs are rendered in a real browser at eight viewports
  # in both colour schemes. None of what this catches is visible in a diff: a
  # stretched screenshot, a light-mode capture shown on a dark page, body copy
  # under 12px, an element pushing the page sideways, a dead anchor.
  site-render:
    name: site/ renders correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          cd scripts
          npm install --silent
          npx --yes playwright install --with-deps chromium

      # Self-test first: it breaks each invariant on purpose and demands the
      # check notice. A render gate that has stopped discriminating looks
      # exactly like one that passes.
      - name: Gate self-test
        run: node scripts/check-render.mjs --selftest

      - name: Render checks
        run: node scripts/check-render.mjs

<script>
(function () {
  var root = document.documentElement;

  /* ── the docs index ───────────────────────────────────────────────── */
  var ICON = {
    book:  '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    play:  '<path d="M5 3l14 9-14 9V3z"/>',
    gear:  '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7"/>',
    server:'<rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/>',
    shield:'<path d="M12 3l8 4v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7z"/>',
    help:  '<circle cx="12" cy="12" r="9"/><path d="M9.2 9a3 3 0 1 1 4 2.8c-.7.3-1.2 1-1.2 1.8v.4M12 17h.01"/>',
    layers:'<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>',
    plug:  '<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>',
    image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
    map:   '<path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
  };

  var GROUPS = [
    { label: 'Start here', docs: [
      { slug: 'overview',          title: 'Overview',           src: 'docs/OVERVIEW.md',           icon: 'book'   },
      { slug: 'getting-started',   title: 'Getting started',    src: 'docs/GETTING-STARTED.md',    icon: 'play'   },
      { slug: 'configuration',     title: 'Configuration',      src: 'docs/CONFIGURATION.md',      icon: 'gear'   }
    ]},
    { label: 'Running it', docs: [
      { slug: 'deployment',        title: 'Deployment',         src: 'docs/DEPLOYMENT.md',         icon: 'server' },
      { slug: 'public-access',     title: 'Public access',      src: 'docs/PUBLIC-ACCESS.md',      icon: 'globe'  },
      { slug: 'security-hardening',title: 'Hardening',          src: 'docs/SECURITY-HARDENING.md', icon: 'shield' },
      { slug: 'troubleshooting',   title: 'Troubleshooting',    src: 'docs/TROUBLESHOOTING.md',    icon: 'help'   }
    ]},
    { label: 'Reference', docs: [
      { slug: 'architecture',      title: 'Architecture',       src: 'docs/ARCHITECTURE.md',       icon: 'layers' },
      { slug: 'api',               title: 'API reference',      src: 'docs/API.md',                icon: 'plug'   },
      { slug: 'screenshots',       title: 'Screenshots',        src: 'docs/SCREENSHOTS.md',        icon: 'image'  }
    ]},
    { label: 'Project', docs: [
      { slug: 'roadmap',           title: 'Roadmap',            src: 'ROADMAP.md',                 icon: 'map'    },
      { slug: 'changelog',         title: 'Changelog',          src: 'CHANGELOG.md',               icon: 'clock'  }
    ]}
  ];

  var DOCS = GROUPS.reduce(function (a, g) { return a.concat(g.docs); }, []);
  var bySlug = {};
  DOCS.forEach(function (d) { bySlug[d.slug] = d; });

  /* filename → slug, so cross-doc .md links resolve to the viewer's routes */
  var byFile = {};
  DOCS.forEach(function (d) {
    var base = d.src.split('/').pop().toLowerCase();
    byFile[base] = d.slug;
  });
  byFile['readme.md'] = 'overview';
  byFile['security.md'] = 'security-hardening';

  var REPO = 'https://github.com/vul-os/wede/blob/main/';

  var content   = document.getElementById('content');
  var crumbNow  = document.getElementById('crumbNow');
  var srcLink   = document.getElementById('srcLink');
  var navList   = document.getElementById('navList');
  var pager     = document.getElementById('pager');
  var outline   = document.getElementById('outline');
  var outlineL  = document.getElementById('outlineList');
  var navCur    = document.getElementById('navCur');

  /* ── build the sidebar ────────────────────────────────────────────── */
  navList.innerHTML = GROUPS.map(function (g) {
    return '<div class="nav-group" data-group>' +
      '<div class="label">' + g.label + '</div>' +
      g.docs.map(function (d) {
        return '<a data-slug="' + d.slug + '" href="#' + d.slug + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          (ICON[d.icon] || ICON.book) + '</svg>' + d.title + '</a>';
      }).join('') + '</div>';
  }).join('');

  /* ── mermaid ──────────────────────────────────────────────────────── */
  var mermaidOK = false;
  function initMermaid() {
    try {
      /* drive mermaid from the site's own tokens so diagrams match the theme */
      var cs = getComputedStyle(document.documentElement);
      var v = function (n) { return cs.getPropertyValue(n).trim(); };
      mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        securityLevel: 'loose',
        themeVariables: {
          fontFamily: "'Inter Variable', sans-serif",
          fontSize: '13px',
          background: v('--bg-primary'),
          primaryColor: v('--bg-elevated'),
          primaryTextColor: v('--text'),
          primaryBorderColor: v('--border-strong'),
          secondaryColor: v('--bg-secondary'),
          tertiaryColor: v('--bg-secondary'),
          lineColor: v('--text-muted'),
          textColor: v('--text-2'),
          nodeBorder: v('--border-strong'),
          clusterBkg: v('--bg-secondary'),
          clusterBorder: v('--border'),
          edgeLabelBackground: v('--bg-primary'),
          mainBkg: v('--bg-elevated'),
          noteBkgColor: v('--accent-dim'),
          noteTextColor: v('--text')
        }
      });
      mermaidOK = true;
    } catch (e) { mermaidOK = false; }
  }
  initMermaid();

  if (window.marked && marked.setOptions) marked.setOptions({ gfm: true, breaks: false });

  /* ── helpers ──────────────────────────────────────────────────────── */
  /* GitHub-compatible slugs: lowercase, punctuation dropped, spaces → dashes,
     underscores and existing dashes preserved (so #frame_ancestors resolves). */
  function slugify(s) {
    return String(s).toLowerCase().trim()
      .replace(/[`*~]/g, '')
      .replace(/[^\p{L}\p{N}_\- ]+/gu, '')
      .replace(/ /g, '-') || 'section';   /* one dash per space, as GitHub does */
  }

  function parseHash() {
    var raw = (location.hash || '').replace(/^#/, '');
    if (!raw) return { slug: DOCS[0].slug, anchor: '' };
    var bits = raw.split(':');
    var slug = bits[0];
    if (!bySlug[slug]) return { slug: DOCS[0].slug, anchor: '' };
    return { slug: slug, anchor: bits[1] || '' };
  }

  /* rewrite a markdown link into a viewer route where we can */
  function rewriteLink(a, slug) {
    var href = a.getAttribute('href') || '';
    if (!href) return;

    if (/^(https?:)?\/\//i.test(href) || /^mailto:/i.test(href)) {
      a.target = '_blank'; a.rel = 'noopener';
      return;
    }
    /* in-page anchor → keep it inside this doc's route */
    if (href.charAt(0) === '#') {
      a.setAttribute('href', '#' + slug + ':' + href.slice(1));
      return;
    }
    /* cross-doc .md link (any case, with or without a docs/ prefix) */
    var m = href.match(/^(?:\.\.\/)*(?:docs\/)?([^\/#?]+\.md)(?:#(.+))?$/i);
    if (m) {
      var target = byFile[m[1].toLowerCase()];
      if (target) {
        a.setAttribute('href', '#' + target + (m[2] ? ':' + m[2] : ''));
        return;
      }
      /* not published on the site — send it to the repo instead */
      a.setAttribute('href', REPO + href.replace(/^(?:\.\.\/)+/, ''));
      a.target = '_blank'; a.rel = 'noopener';
      return;
    }
    /* any other repo-relative path → the repo */
    if (!/^[a-z]+:/i.test(href) && !/^\.\/(assets|screenshots)\//.test(href)) {
      a.setAttribute('href', REPO + href.replace(/^(?:\.\.\/)+/, ''));
      a.target = '_blank'; a.rel = 'noopener';
    }
  }

  function decorate(slug) {
    /* headings: ids on h2–h4 so any anchor a doc links to resolves; the
       outline itself only lists h2 and h3 */
    var heads = [].slice.call(content.querySelectorAll('h2, h3, h4'));
    var used = {};
    var items = [];
    heads.forEach(function (h) {
      var id = slugify(h.textContent);
      if (used[id]) { used[id]++; id = id + '-' + used[id]; } else { used[id] = 1; }
      h.id = id;
      var a = document.createElement('a');
      a.className = 'anchor'; a.href = '#' + slug + ':' + id;
      a.setAttribute('aria-label', 'Link to this section'); a.textContent = '#';
      h.insertBefore(a, h.firstChild);
      if (h.tagName !== 'H4') {
        items.push({ id: id, text: h.textContent.replace(/^#/, '').trim(), level: h.tagName === 'H3' ? 3 : 2 });
      }
    });

    if (items.length > 2) {
      outlineL.innerHTML = items.map(function (it) {
        return '<a class="' + (it.level === 3 ? 'h3' : '') + '" href="#' + slug + ':' + it.id + '">' + it.text + '</a>';
      }).join('');
      outline.hidden = false;
    } else {
      outline.hidden = true; outlineL.innerHTML = '';
    }

    /* links */
    content.querySelectorAll('a[href]').forEach(function (a) { rewriteLink(a, slug); });

    /* images: markdown written for the repo points at docs/screenshots/… */
    content.querySelectorAll('img').forEach(function (img) {
      var s = img.getAttribute('src') || '';
      if (/^https?:/i.test(s)) return;
      var m = s.match(/(?:\.\.\/)*(?:docs\/)?screenshots\/(.+)$/);
      if (m) { img.setAttribute('src', 'screenshots/' + m[1]); return; }
      var a = s.match(/(?:\.\.\/)*(?:docs\/)?assets\/(.+)$/);
      if (a) { img.setAttribute('src', 'assets/' + a[1]); return; }
      img.setAttribute('src', REPO.replace('/blob/', '/raw/') + s.replace(/^(?:\.\.\/)+/, ''));
    });
    content.querySelectorAll('img').forEach(function (img) { img.loading = 'lazy'; });

    /* tables get their own scroll container */
    content.querySelectorAll('table').forEach(function (t) {
      if (t.parentElement && t.parentElement.classList.contains('md-table-wrap')) return;
      var w = document.createElement('div');
      w.className = 'md-table-wrap';
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });

    /* copy buttons on code blocks */
    content.querySelectorAll('pre > code').forEach(function (code) {
      if (code.classList.contains('language-mermaid')) return;
      var pre = code.parentElement;
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'copybtn';
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>copy</span>';
      btn.addEventListener('click', function () {
        var text = code.textContent;
        var done = function () {
          btn.classList.add('done');
          btn.querySelector('span').textContent = 'copied';
          setTimeout(function () { btn.classList.remove('done'); btn.querySelector('span').textContent = 'copy'; }, 1500);
        };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () {});
      });
      pre.appendChild(btn);
    });
  }

  async function renderMermaid() {
    if (!mermaidOK) return;
    content.querySelectorAll('code.language-mermaid').forEach(function (code) {
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      var pre = code.closest('pre');
      if (pre) pre.replaceWith(div);
    });
    var nodes = content.querySelectorAll('.mermaid');
    if (nodes.length) { try { await mermaid.run({ nodes: nodes }); } catch (e) { console.warn('mermaid', e); } }
  }

  function buildPager(i) {
    var prev = DOCS[i - 1], next = DOCS[i + 1];
    var html = '';
    if (prev) html += '<a class="prev" href="#' + prev.slug + '"><span class="dir">← Previous</span><span class="ttl">' + prev.title + '</span></a>';
    if (next) html += '<a class="next" href="#' + next.slug + '"><span class="dir">Next →</span><span class="ttl">' + next.title + '</span></a>';
    pager.innerHTML = html;
  }

  /* ── outline scroll-spy ───────────────────────────────────────────── */
  var spy = null;
  function startSpy() {
    if (spy) { spy.disconnect(); spy = null; }
    if (outline.hidden || !('IntersectionObserver' in window)) return;
    var links = {};
    outlineL.querySelectorAll('a').forEach(function (a) {
      links[a.getAttribute('href').split(':')[1]] = a;
    });
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        outlineL.querySelectorAll('a').forEach(function (a) { a.classList.remove('active'); });
        var a = links[e.target.id];
        if (a) a.classList.add('active');
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    content.querySelectorAll('h2, h3').forEach(function (h) { spy.observe(h); });
  }

  /* ── load ─────────────────────────────────────────────────────────── */
  var currentSlug = null;

  async function load(slug, anchor) {
    var i = DOCS.findIndex(function (d) { return d.slug === slug; });
    var doc = DOCS[i];

    navList.querySelectorAll('a').forEach(function (a) {
      a.classList.toggle('active', a.dataset.slug === slug);
    });
    crumbNow.textContent = doc.title;
    navCur.textContent = doc.title;
    srcLink.href = REPO + doc.src;
    document.title = doc.title + ' — wede docs';

    if (currentSlug !== slug) {
      content.innerHTML = '<div class="skel"><i class="t"></i><i></i><i></i><i></i></div>';
      try {
        var res = await fetch('./docs/' + slug + '.md', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        content.innerHTML = marked.parse(await res.text());
        decorate(slug);
        await renderMermaid();
        startSpy();
        currentSlug = slug;
      } catch (err) {
        content.innerHTML = '<div class="docs-error"><b>Could not load <code>' + slug +
          '.md</code></b> — ' + err.message +
          '.<br>You can read it on <a href="' + REPO + doc.src + '" target="_blank" rel="noopener">GitHub</a> instead.</div>';
        outline.hidden = true;
        currentSlug = slug;
      }
      buildPager(i);
    }

    if (anchor) {
      var el = document.getElementById(anchor);
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    }
    window.scrollTo({ top: 0 });
  }

  function route() { var h = parseHash(); load(h.slug, h.anchor); }
  window.addEventListener('hashchange', route);
  route();

  /* ── sidebar filter ───────────────────────────────────────────────── */
  var search = document.getElementById('navSearch');
  var noHits = document.getElementById('noHits');
  search.addEventListener('input', function () {
    var q = search.value.trim().toLowerCase();
    var hits = 0;
    navList.querySelectorAll('[data-group]').forEach(function (g) {
      var shown = 0;
      g.querySelectorAll('a').forEach(function (a) {
        var match = !q || a.textContent.toLowerCase().indexOf(q) !== -1;
        a.hidden = !match;
        if (match) { shown++; hits++; }
      });
      g.hidden = shown === 0;
    });
    noHits.hidden = hits !== 0;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== search &&
        !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault(); search.focus(); search.select();
    }
    if (e.key === 'Escape' && document.activeElement === search) {
      search.value = ''; search.dispatchEvent(new Event('input')); search.blur();
    }
  });

  /* ── mobile nav ───────────────────────────────────────────────────── */
  var nav = document.getElementById('docsNav');
  var toggle = document.getElementById('navToggle');
  toggle.addEventListener('click', function () {
    var open = nav.classList.toggle('collapsed') === false;
    toggle.setAttribute('aria-expanded', String(open));
  });
  navList.addEventListener('click', function (e) {
    if (e.target.closest('a') && window.innerWidth <= 880) {
      nav.classList.add('collapsed');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });
  function syncNav() { if (window.innerWidth > 880) nav.classList.remove('collapsed'); }
  window.addEventListener('resize', syncNav);
  syncNav();

  /* ── theme ────────────────────────────────────────────────────────── */
  document.getElementById('theme').addEventListener('click', async function () {
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('wede-site-theme', next); } catch (e) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', next === 'light' ? '#f0f2f7' : '#0c0e14');
    /* re-render diagrams in the new theme */
    if (content.querySelector('.mermaid')) {
      var slug = currentSlug; currentSlug = null;
      initMermaid();
      await load(slug, '');
    }
  });
})();
</script>
</body>
</html>
